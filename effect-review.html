<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow · 渲染复核</title><style>
*{box-sizing:border-box}body{background:#111216;color:#e4eae7;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;margin:0;padding:28px}h1{font-size:26px;font-weight:400}p{color:#9fadaa;line-height:1.7;font-size:12px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:20px auto}.frame{position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:12px;background:#34414b}.frame img,.frame canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover}.frame img{filter:brightness(.68) saturate(.65);object-position:50% 40%}.frame canvas{z-index:1}article>small{display:block;margin:12px 0;color:#b8c9c2;font-size:11px}button{background:#dce8df;color:#213027;border:0;border-radius:5px;padding:10px 15px;cursor:pointer;margin:0 8px 10px 0}.label{position:absolute;z-index:2;bottom:18px;left:16px;font-size:10px;letter-spacing:2px}#result{font-size:10px;color:#97b2a8}@media(max-width:700px){body{padding:16px}main{gap:10px}.label{font-size:7px;left:8px}h1{font-size:20px}}
</style></head><body><h1>AFTERGLOW / 视觉复核</h1><p>真实渲染模块的固定时间截帧。静态人像与固定碰撞代理，仅用于比对效果；不代表真人识别测试。</p><button data-style="opal">Opal rain · 棱光细雨</button><button data-style="nova">Golden hour · 落日余晖</button><button id="replay">重新生成</button><main><article><div class="frame"><img alt="静态场景示意" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&auto=format&fit=crop&q=85"><canvas></canvas><div class="label">01 / RAIN</div></div><small>微笑 · 远 / 中 / 近三层雨</small></article><article><div class="frame"><img alt="静态场景示意" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&auto=format&fit=crop&q=85"><canvas></canvas><div class="label">02 / BLOOM</div></div><small>大笑 · 升空后的绽放</small></article><article><div class="frame"><img alt="静态场景示意" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900&auto=format&fit=crop&q=85"><canvas></canvas><div class="label">03 / AFTERGLOW</div></div><small>下坠 · 碰撞与余烬</small></article></main><p id="result"></p><script type="module">
import {CinematicEffects} from './cinematic-effects.js?v=8';
let style='opal';
function draw(){const out=[];document.querySelectorAll('canvas').forEach((canvas,i)=>{canvas.width=600;canvas.height=1067;const ctx=canvas.getContext('2d'),fx=new CinematicEffects({canvas,ctx});fx.resize(600,1067);fx.setStyle(style);const head={x:300,y:469,rx:147,ry:224};if(i)fx.launch(head,0,{intensity:.85,quality:1});const frames=i===0?100:i===1?55:105;for(let n=1;n<=frames;n++){ctx.clearRect(0,0,600,1067);fx.frame(1/60,n*1000/60,{mode:i?'bloom':'rain',head,velocity:{x:0,y:0},intensity:.85,quality:1,preview:true});}out.push(fx.stats());});document.getElementById('result').textContent=out.map((x,i)=>`画面 ${i+1}：${x.active} 粒子 / ${x.collisions} 模拟接触`).join('　');}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;draw();});document.getElementById('replay').onclick=draw;draw();
</script></body></html>
